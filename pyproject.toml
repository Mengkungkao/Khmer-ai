[project]
name = "khmer-language"
version = "0.1.0"
description = "KhmerAI Project 1: a from-scratch Khmer Unicode, grapheme, and linguistic engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
khmer-analyze = "khmer_language.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["khmer_language*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
